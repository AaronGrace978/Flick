name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
      - if: runner.os == 'Linux'
        run: python3 ../tests/udp_smoke.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: android
        run: ./gradlew --no-daemon :core:check :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flick-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
