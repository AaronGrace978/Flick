name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created from the selected ref if missing)
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ''
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
          - os: macos-latest
            name: macos-arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: rustup toolchain install stable --profile minimal
      - working-directory: desktop
        run: cargo +stable build --release --locked
      - shell: bash
        run: |
          dir="flick-desktop-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp desktop/target/release/emitter${{ matrix.ext }} desktop/target/release/receiver${{ matrix.ext }} README.md "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$dir.zip" "$dir"; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: flick-desktop-*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "flick-android-$TAG.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: flick-android-*.apk
          if-no-files-found: error
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file RELEASE_NOTES.md --prerelease
