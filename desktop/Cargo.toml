[package]
name = "flick-radar"
version = "0.2.0"
edition = "2021"

[dependencies]
cpal = { version = "0.15.3", optional = true }

[features]
default = ["audio"]
audio = ["dep:cpal"]

[[bin]]
name = "emitter"
required-features = ["audio"]

[workspace]
members = ["overlay"]
default-members = ["."]
resolver = "2"
